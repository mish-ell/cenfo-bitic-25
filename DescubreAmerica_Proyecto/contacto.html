           <!-- Contenedor de Description -->

           <section>
            <h2 class="centrado" style="padding: 70px">Formulario de contacto</h2>
           </section>

           <section class="principal">
            <form method="post" action="" id="form1">
                <br><br>
                <label for="nombre">Nombre:</label>
                <input id="nombreTxt" name="nombre" type="text" placeholder="Escriba su nombre completo" required />
                <br><br>
                <label for="apellidos">Apellidos:</label>
                <input id="apellidoTxt" name="apellidos" type="text" placeholder="Escriba sus apellidos completos" required/>
                <br><br>        
                <label for="correo">Email:</label>
                <input id="emailTxt" name="correo" type="email" placeholder="Formato del email: nombre@dominio.com" required/>
                <br><br>
                <label for="telefono">Teléfono:</label>
                <input id="numberTxt" name="telefono" type="text" placeholder="Escriba su celular" required/>
                <br><br>        
                <label for="comentarios">Mensaje:</label>
                <textarea id="mensajeTxt" name="comentarios" placeholder="Escriba su mensaje" rows="10" cols="10" required></textarea>
                
                <!-- resultado del mensaje enviado JS -->
                <p class="centrado" id="mensajeAlert"></p>
                <input type="submit" value="Enviar" class="enviar" id="btnSend">
            </form>
        </section>

              <div class="bajar2">  </div>



      <!-- Contenedor de Mapa -->

      <section>
        <div id="maps-container">
          <h2>Visita nuestro local en Nosara Guanacaste</h2>
          <br>
          <div id="map"></div>
          <script
            src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC9Y0vv2PTVdEtvNlcjxlesxjP3f69G3Pg&callback=initMap&v=weekly&solution_channel=GMP_CCS_geocodingservice_v2"
            defer
          ></script>
          <script>
            function initMap() {
              var nosara =  { lat: 9.9797, lng: -85.6520 };
              var map = new google.maps.Map(document.getElementById('map'), {
                zoom: 6,
                center: nosara
              });
              var marker = new google.maps.Marker({
                position: nosara,
                map: map
              });
            }
          </script>
        </div>
      </section>
